function qPhoto(){const r=pick(RS().filter(r=>r.img),1)[0];if(!r)return;const o=sh([r,...pick(R.filter(x=>x!=r),3)]);
 return{t:'o',head:'Что это за ролл?',pic:pic(r,200),o:o.map(x=>({t:x.n})),a:[o.indexOf(r)],id:'f'+r.n}}
function qOut(){const r=pick(RS().filter(r=>r.out.length),1)[0];if(!r)return;const s=r.out.join(', ');
 const o=sh([s,...pick([...new Set(R.map(x=>x.out.join(', ')).filter(x=>x&&x!=s))],3)]);
 return{t:'o',head:`Во что обваливается «${r.n}»?`,pic:pic(r,110),o:o.map(x=>({t:x,e:E(x.split(',')[0])})),a:[o.indexOf(s)],id:'u'+r.n}}
function qSetFull(){const s=pick(SE.filter(s=>s.items.length>=2),1)[0];
 const c=pick(s.items.map((_,j)=>j),5).map(j=>({t:s.items[j],e:E((R.find(r=>r.n==s.m[j])||{ing:['']}).ing[0]||'')}));
 const d=pick(R.filter(r=>!s.k.some(k=>k.startsWith(r.k)||r.k.startsWith(k))),4).map(r=>({t:r.n,e:E(r.ing[0]||'')}));
 const o=sh([...c,...d]);
 return{t:'m',head:`Что входит в сет «${s.n}»?`,pic:pic(s,110),o,a:o.map((x,i)=>c.includes(x)?i:-1).filter(i=>i>=0),id:'sf'+s.n}}
function qSet(){const s=pick(SE,1)[0],ok=pick(s.items,1)[0];
 const bad=pick(R.filter(r=>!s.k.some(k=>k.startsWith(r.k)||r.k.startsWith(k))).map(r=>r.n),3),o=sh([ok,...bad]);
 return{t:'o',head:`Что входит в сет «${s.n}»?`,pic:pic(s,110),o:o.map(t=>({t})),a:[o.indexOf(ok)],id:'s'+s.n}}
function qSetOf(){const r=pick(RS().filter(r=>r.sets.length),1)[0];if(!r)return;const ok=pick(r.sets,1)[0];
 const o=sh([ok,...pick(SE.filter(s=>!s.k.some(k=>k.startsWith(r.k)||r.k.startsWith(k))),3)]);
 return{t:'o',head:`В каком сете есть «${r.n}»?`,pic:pic(r,110),o:o.map(s=>({t:'Сет '+s.n})),a:[o.indexOf(ok)],id:'o'+r.n}}
const TY={out:[qOut],setfull:[qSetFull],mix:[qComp,qOut,qCap,qRev,qPhoto,qSetFull,qSet,qSetOf],photo:[qPhoto],comp:[qComp],cap:[qCap],rev:[qRev],set:[qSetFull,qSet,qSetOf]};
function gen(m){const qs=[],seen=new Set();for(let t=0;t<80&&qs.length<10;t++){const q=pick(TY[m],1)[0]();if(q&&!seen.has(q.id)){seen.add(q.id);qs.push(q)}}return qs}
function start(m){L={mode:m,qs:gen(m),h:5,xp:0,ok:0,tot:0,done:0,sel:[],chk:false};L.n=L.qs.length;draw()}
function pk(i){if(L.chk)return;const q=L.qs[0];L.sel=q.t=='m'?(L.sel.includes(i)?L.sel.filter(x=>x!=i):[...L.sel,i]):[i];draw()}
function check(){const q=L.qs[0],a=[...q.a].sort().join(),s=[...L.sel].sort().join();L.good=a==s;L.chk=true;L.tot++;if(L.good){L.ok++;L.xp+=10}else L.h--;draw()}
function next(){const q=L.qs.shift();if(L.good)L.done++;else if(!q.r){q.r=1;L.qs.push(q)}else L.done++;
 if(L.h<=0||!L.qs.length){L.end=1;const t=new Date().toDateString();if(S.day!=t){S.streak=S.day==new Date(Date.now()-864e5).toDateString()?S.streak+1:1;S.day=t}S.xp+=L.xp;save()}
 L.sel=[];L.chk=false;draw()}
const homeH=()=>{const M=[['mix','🎲','Всё вперемешку','Все типы вопросов'],['comp','🥒','Состав','Что внутри ролла'],['out','🥢','Обсыпка снаружи','Во что обваливается'],['cap','🧀','Шапки','Чем украшать'],['photo','📷','Угадай по фото','Какой это ролл'],['rev','🧩','Угадай по составу','По ингредиентам'],['setfull','🍱','Состав сета','Выбери все роллы сета'],['set','🔎','Сеты: быстро','Что входит и в каком сете']];
 return`<div class="top"><span>🍣 Тренажёр кухни</span><span>🔥${S.streak} ⭐${S.xp}</span></div><p class="mut">Урок: 10 вопросов, 5 сердец. Ошибки вернутся в конце. <a href="./" style="color:var(--b)">← к каталогу</a></p>
 <div class="chips">${[['all','Все роллы'],...Object.entries(CATS)].map(([k,v])=>`<button class="chip ${cat==k?'on':''}" onclick="cat='${k}';draw()">${v}</button>`).join('')}</div>
 <div class="list">${M.map(m=>`<button class="opt mode" onclick="start('${m[0]}')"><span class="e">${m[1]}</span><span><b>${m[2]}</b><br><span class="mut">${m[3]}</span></span></button>`).join('')}</div>`};
const lessonH=()=>{if(L.end){const d=L.h<=0;return`<div class="end"><div style="font-size:72px">${d?'💔':'🎉'}</div><h2>${d?'Сердца закончились':'Урок пройден!'}</h2><p>⭐ +${L.xp} XP · точность ${L.tot?Math.round(100*L.ok/L.tot):0}%</p><button class="btn" onclick="start(L.mode)">Ещё раз</button><button class="btn ghost" onclick="L=null;draw()">Домой</button></div>`}
 const q=L.qs[0],m=q.t=='m';
 const opts=q.o.map((o,i)=>{let c='opt';if(L.chk)c+=q.a.includes(i)?' ok':L.sel.includes(i)?' bad':'';else if(L.sel.includes(i))c+=' sel';
  return`<button class="${c}" onclick="pk(${i})">${o.e?`<span class="e">${o.e}</span>`:''}${esc(o.t)}</button>`}).join('');
 const rt=q.a.map(i=>q.o[i].t).join(', ');
 return`<div class="top"><button class="x" onclick="L=null;draw()">✕</button><div class="bar"><i style="width:${Math.round(100*L.done/L.n)}%"></i></div><span>❤️${L.h}</span></div>
 <h2>${esc(q.head)}</h2>${m?'<p class="mut">Выбери все подходящие</p>':''}${q.pic}<div class="${m?'grid':'list'}">${opts}</div>
 <div class="fb ${L.chk?(L.good?'ok':'bad'):''}"><div>${L.chk?`<b>${L.good?'Верно! 🎉':'Не совсем'}</b>${L.good?'':`<span>Правильно: ${esc(rt)}</span>`}<button class="btn ${L.good?'':'red'}" onclick="next()">Дальше</button>`:`<button class="btn" ${L.sel.length?'':'disabled'} onclick="check()">Проверить</button>`}</div></div>`};
const al=r=>(r.note?` <i class="mut" style="font-weight:400;font-size:.85em">${r.note}</i>`:'')+(r.ing.length==2&&r.ing.includes('сыр')&&r.ing.includes('огурец')&&!/филадел/i.test(r.n)?' <i class="mut" style="font-weight:400;font-size:.85em">Филадельфия</i>':'');
const rollH=r=>`<div class="row">${pic(r,72)}<div><b>${esc(r.n)}</b>${al(r)}<div>${[...new Set(r.ing.map(E))].join(' ')}</div></div></div>${esc(r.ing.join(', '))}${r.cap?`<div class="mut">Шапка: ${E(r.cap.split(',')[0])} ${esc(r.cap)}</div>`:''}`;
const itemH=(i,n)=>{const r=R.find(r=>r.n==n);if(!r)return`<div class="sub"><summary style="list-style:none">${esc(i)}</summary></div>`;
 const k=kk(i.replace(/\(.*$/,'')),v={...r,ing:r.ing.map(x=>x.includes('/')?(x.split('/').find(a=>k.includes(kk(a).slice(0,5)))||x):x),img:D.ipics[k]||r.img};
 return`<details class="sub"><summary>${E(v.ing[0]||'')} ${esc(i)}${al(r)}</summary>${rollH(v)}</details>`};
const listH=()=>{const q=kk(qry);let h='';
 if(sc!='sets')h+=R.filter(r=>(sc=='all'||r.cat==sc)&&(!q||r.k.includes(q))).map(r=>`<div class="card">${rollH(r)}</div>`).join('');
 if(sc=='all'||sc=='sets')h+=SE.filter(s=>!q||kk(s.n).includes(q)).map(s=>`<details class="card"><summary><span class="row">${s.img?pic(s,72):'🍱'}<b>Сет ${esc(s.n)}</b></span><span class="mut">${s.items.length} поз. · нажми, чтобы раскрыть</span></summary><div class="list" style="margin-top:10px">${s.items.map((x,j)=>itemH(x,s.m[j])).join('')}</div>${Object.keys(s.rice).length?`<div class="mut" style="margin-top:8px">Рис: ${Object.entries(s.rice).map(([k,v])=>`${esc(k)} — ${esc(v)}`).join('; ')}</div>`:''}</details>`).join('');
 return h||'<p class="mut">Ничего не найдено</p>'};
const studyH=()=>`<div class="top"><span>📖 Меню</span></div><input placeholder="Поиск ролла или сета" value="${esc(qry)}" oninput="qry=this.value;$('#lst').innerHTML=listH()">
 <div class="chips">${[['all','Всё'],...Object.entries(CATS),['sets','Сеты']].map(([k,v])=>`<button class="chip ${sc==k?'on':''}" onclick="sc='${k}';draw()">${v}</button>`).join('')}</div><div class="list" id="lst">${listH()}</div>`;
const nav=()=>`<nav><button class="${T=='home'?'on':''}" onclick="T='home';draw()">🏠<small>Учиться</small></button><button class="${T=='study'?'on':''}" onclick="T='study';draw()">📖<small>Меню</small></button></nav>`;
function draw(){$('#app').innerHTML=L?lessonH():(T=='home'?homeH():studyH())+nav();window.scrollTo(0,0)}
draw();
</script></body></html>
