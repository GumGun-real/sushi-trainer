<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учить меню — Почтальон суши</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎯</text></svg>">
<style>
:root{--bg:#fff;--fg:#3c3c3c;--mut:#777;--card:#fff;--line:#e5e5e5;--g:#58cc02;--gd:#58a700;--r:#ff4b4b;--rd:#ea2b2b;--b:#1cb0f6;--selbg:#ddf4ff;--okbg:#d7ffb8;--badbg:#ffdfe0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--fg:#e8eef0;--mut:#8a9ba1;--card:#1b2b32;--line:#37464f;--selbg:#12384a;--okbg:#1d3a14;--badbg:#4a2024;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131f24;--fg:#e8eef0;--mut:#8a9ba1;--card:#1b2b32;--line:#37464f;--selbg:#12384a;--okbg:#1d3a14;--badbg:#4a2024;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:12px 14px 140px}
a{color:var(--b);text-decoration:none}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:6px;font-weight:800}
.mut{color:var(--mut)}h2{margin:8px 0}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;font:800 16px inherit;font-family:inherit;text-transform:uppercase;letter-spacing:.5px;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);cursor:pointer;margin-top:10px}
.btn:disabled{background:var(--line);color:var(--mut);box-shadow:0 4px 0 var(--mut)}
.btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.btn.ghost{background:var(--card);color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.opt,.card{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px;background:var(--card);color:inherit;font:600 16px inherit;font-family:inherit;text-align:left}
.opt{cursor:pointer}.card{font-weight:400}
.opt.sel{border-color:var(--b);background:var(--selbg)}.opt.ok{border-color:var(--g);background:var(--okbg)}.opt.bad{border-color:var(--r);background:var(--badbg)}
.list{display:grid;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.chip{border:2px solid var(--line);border-radius:20px;padding:4px 12px;background:var(--card);color:inherit;font:600 14px inherit;font-family:inherit;cursor:pointer}
.chip.on{border-color:var(--b);background:var(--selbg)}
summary{cursor:pointer;list-style-position:inside}
input{width:100%;box-sizing:border-box;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:16px inherit;font-family:inherit}
.bar{flex:1;height:14px;background:var(--line);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.x{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.fb{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}
.fb>div{max-width:520px;margin:0 auto}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb b{display:block}
.end{text-align:center;padding-top:30px}
</style></head><body><div id="app">Загрузка меню…</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>[...a].sort(()=>Math.random()-.5),pick=(a,k)=>sh(a).slice(0,k);
const kk=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[^а-яa-z0-9]/g,'');
const CATS={bake:'Запечённые',tempura:'Темпурные',cold:'Холодные'};
let D,R,SE,ALL,K={},L=null,filt='all',qry='',only=false;
try{K=JSON.parse(localStorage.getItem('sk'))||{}}catch(e){}
const save=()=>{try{localStorage.setItem('sk',JSON.stringify(K))}catch(e){}};

async function load(){
  for(const u of ['./index.html','./kitchen.html']){
    try{const t=await(await fetch(u)).text();const m=t.match(/const D=(\{[\s\S]*?\});\s*const \$=/);if(m){D=JSON.parse(m[1]);break}}catch(e){}
  }
  if(!D){$('#app').innerHTML='<p>Не получилось загрузить меню. Открой страницу с интернетом один раз, потом будет работать офлайн.</p>';return}
  R=D.rolls;SE=D.sets;
  R.forEach(r=>{r.key='r:'+r.n;r.k=kk(r.n)});
  SE.forEach(s=>{s.key='s:'+s.n;s.nm=[...new Set(s.m)].filter(n=>R.some(r=>r.n==n))});
  R.forEach(r=>r.sets=SE.filter(s=>s.m.some(n=>kk(n)==r.k)));
  ALL=[...R,...SE];
  draw();
}

/* вопросы */
const POOL=()=>[...new Set(R.flatMap(r=>r.ing))];
function rollFns(r){
  const T=[];
  T.push(()=>{const o=sh([...r.ing,...pick(POOL().filter(x=>!r.ing.includes(x)),4)]);return{t:'m',h:`Что в ролле «${r.n}»?`,o,a:o.map((x,i)=>r.ing.includes(x)?i:-1).filter(i=>i>=0)}});
  if(r.cap&&r.cap.length<80)T.push(()=>{const o=sh([r.cap,...pick([...new Set(R.map(x=>x.cap).filter(c=>c&&c.length<80&&kk(c)!=kk(r.cap)))],3)]);return{t:'o',h:`Чем украсить «${r.n}»?`,o,a:[o.indexOf(r.cap)]}});
  if(r.out.length){const s=r.out.join(', ');T.push(()=>{const o=sh([s,...pick([...new Set(R.map(x=>x.out.join(', ')).filter(x=>x&&x!=s))],3)]);return{t:'o',h:`Во что обваливается «${r.n}»?`,o,a:[o.indexOf(s)]}})}
  if(r.sets.length)T.push(()=>{const ok=pick(r.sets,1)[0];const o=sh([ok,...pick(SE.filter(s=>!r.sets.includes(s)),3)]);return{t:'o',h:`В каком сете есть «${r.n}»?`,o:o.map(s=>'Сет '+s.n),a:[o.indexOf(ok)]}});
  if(r.img)T.push(()=>{const o=sh([r,...pick(R.filter(x=>x!=r),3)]);return{t:'o',h:'Что это за ролл?',img:r.img,o:o.map(x=>x.n),a:[o.indexOf(r)]}});
  return T;
}
function setFn(s){
  return()=>{const have=pick(s.nm,Math.min(6,s.nm.length));const bad=pick(R.filter(r=>!s.m.some(n=>kk(n)==r.k)).map(r=>r.n),4);const o=sh([...have,...bad]);return{t:'m',h:`Что входит в сет «${s.n}»?`,o,a:o.map((x,i)=>have.includes(x)?i:-1).filter(i=>i>=0)}}
}
const itemOf=x=>({key:x.key,name:x.cat?x.n:'Сет '+x.n,fns:x.cat?rollFns(x):[setFn(x)]});

/* урок */
function begin(items,per){
  const qs=[];
  items.forEach(it=>{
    const P=f=>qs.push({f,key:it.key,core:f===it.fns[0]});
    if(per){[it.fns[0],...pick(it.fns.slice(1),per-1)].forEach(P)}
    else for(let rep=0;rep<2;rep++)it.fns.forEach(P);
  });
  if(!qs.length){alert('Для этой позиции нет вопросов');return}
  L={items,per,qs:sh(qs),sel:[],chk:false,miss:{},ok:{},done:0};
  draw();
}
function learn(i){
  const x=ALL[i];let items=[itemOf(x)];
  if(!x.cat){x.nm.slice(0,8).forEach(n=>{const r=R.find(r=>r.n==n);if(r)items.push(itemOf(r))});begin(items,2);items[0].fns=[setFn(x),setFn(x)];L.qs=sh([...L.qs,{f:setFn(x),key:x.key}])}
  else begin(items,0);
}
function learnUnknown(){
  const u=ALL.filter(x=>!K[x.key]);
  if(!u.length){alert('Всё выучено 🎉');return}
  begin(pick(u,6).map(itemOf),2);
}
function pk(i){
  if(L.chk)return;const c=L.qs[0].c;
  L.sel=c.t=='m'?(L.sel.includes(i)?L.sel.filter(x=>x!=i):[...L.sel,i]):[i];draw();
}
function check(){
  const q=L.qs[0],c=q.c;
  L.good=[...c.a].sort().join()==[...L.sel].sort().join();L.chk=true;
  if(L.good&&q.core)L.ok[q.key]=1;
  if(!L.good){L.miss[q.key]=1;if(!q.retry)L.qs.push({f:q.f,key:q.key,core:q.core,retry:1})}
  draw();
}
function next(){
  L.qs.shift();L.done++;L.sel=[];L.chk=false;
  if(!L.qs.length){L.end=1;L.items.forEach(it=>{if(L.miss[it.key]||!L.ok[it.key])delete K[it.key];else K[it.key]=1});save()}
  draw();
}
function tg(i){const k=ALL[i].key;K[k]?delete K[k]:K[k]=1;save();draw()}

/* экран */
const items=()=>{
  const q=kk(qry);
  return ALL.map((x,i)=>[x,i]).filter(([x,i])=>{
    const isR=i<R.length;
    if(only&&K[x.key])return false;
    if(filt=='sets')return !isR&&(!q||kk(x.n).includes(q));
    if(filt!='all'&&(!isR||x.cat!=filt))return false;
    return !q||kk(x.n).includes(q);
  }).map(([x,i])=>{
    const isR=i<R.length,k=K[x.key];
    const body=isR?esc(x.ing.join(', '))+(x.cap?'<br>Шапка: '+esc(x.cap):'')+(x.out.length?'<br>Снаружи: '+esc(x.out.join(', ')):''):esc(x.items.join(', '));
    return`<div class="card"><details><summary><b>${esc(isR?x.n:'Сет '+x.n)}</b> ${k?'✅':''}</summary><div class="mut">${body}</div></details><div class="row"><button class="chip ${k?'on':''}" onclick="tg(${i})">${k?'✅ Знаю':'⬜ Не знаю'}</button><button class="chip" onclick="learn(${i})">🎯 Учить</button></div></div>`;
  }).join('')||'<p class="mut">Ничего нет</p>';
};
const listH=()=>{
  const known=ALL.filter(x=>K[x.key]).length;
  return`<div class="top"><a href="./">← к тренажёру</a><span>${known}/${ALL.length} ✅</span></div><h2>Учить меню</h2>
<button class="btn" onclick="learnUnknown()">🎯 Учить то, что не знаю (${ALL.length-known})</button>
<input style="margin-top:12px" placeholder="Поиск" value="${esc(qry)}" oninput="qry=this.value;$('#lst').innerHTML=items()">
<div class="chips">${[['all','Все'],...Object.entries(CATS),['sets','Сеты']].map(([k,v])=>`<button class="chip ${filt==k?'on':''}" onclick="filt='${k}';draw()">${v}</button>`).join('')}<button class="chip ${only?'on':''}" onclick="only=!only;draw()">Только не знаю</button></div>
<div class="list" id="lst">${items()}</div>`;
};
const lessonH=()=>{
  if(L.end){
    return`<div class="end"><div style="font-size:72px">🎉</div><h2>Урок пройден</h2>
<div style="text-align:left" class="list">${L.items.map(it=>`<div class="card">${L.miss[it.key]||!L.ok[it.key]?'⬜ Повторить':'✅ Выучено'}: <b>${esc(it.name)}</b></div>`).join('')}</div>
<button class="btn" onclick="begin(L.items,L.per)">Ещё раз</button><button class="btn ghost" onclick="L=null;draw()">К списку</button></div>`;
  }
  const q=L.qs[0];if(!q.c)q.c=q.f();const c=q.c,m=c.t=='m';
  const opts=c.o.map((x,i)=>{let k='opt';if(L.chk)k+=c.a.includes(i)?' ok':L.sel.includes(i)?' bad':'';else if(L.sel.includes(i))k+=' sel';return`<button class="${k}" onclick="pk(${i})">${esc(x)}</button>`}).join('');
  const rt=c.a.map(i=>c.o[i]).join(', ');
  const w=Math.round(100*L.done/(L.done+L.qs.length));
  return`<div class="top"><button class="x" onclick="L=null;draw()">✕</button><div class="bar"><i style="width:${w}%"></i></div></div>
<h2>${esc(c.h)}</h2>${m?'<p class="mut">Выбери все подходящие</p>':''}${c.img?`<div style="text-align:center;margin:8px 0"><img src="${c.img}" alt="" style="max-width:220px;width:100%;border-radius:16px"></div>`:''}
<div class="${m?'grid':'list'}">${opts}</div>
<div class="fb ${L.chk?(L.good?'ok':'bad'):''}"><div>${L.chk?`<b>${L.good?'Верно! 🎉':'Не совсем'}</b>${L.good?'':`<span>Правильно: ${esc(rt)}</span>`}<button class="btn ${L.good?'':'red'}" onclick="next()">Дальше</button>`:`<button class="btn" ${L.sel.length?'':'disabled'} onclick="check()">Проверить</button>`}</div></div>`;
};
function draw(){$('#app').innerHTML=L?lessonH():listH();window.scrollTo(0,0)}
load();
</script></body></html>
